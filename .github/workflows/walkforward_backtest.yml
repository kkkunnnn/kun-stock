name: Full Historical Research Pipeline

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "重新下載 2019 至今歷史價格（平常不用勾）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: historical-walkforward
  cancel-in-progress: false

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run historical walk-forward
        env:
          TZ: Asia/Taipei
          WF_START_DATE: "2019-01-01"
          WF_REFRESH_DATA: ${{ inputs.refresh_data }}
        run: python historical_walkforward.py

      - name: Commit walk-forward results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/walkforward_*.csv data/selection_v2_*.csv data/selection_v21_*.csv data/ignition_v2_*.csv data/discovery_v1_*.csv data/macro_v1_*.csv data/walkforward_price_cache.csv.gz
          if git diff --cached --quiet; then
            echo "No walk-forward changes to commit."
          else
            git commit -m "Update full historical research pipeline"
            git push
          fi
